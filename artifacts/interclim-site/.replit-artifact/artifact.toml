kind = "web"
previewPath = "/"
title = "Interclim — Clínica Médica"
description = "Site institucional responsivo da Interclim, clínica médica de diagnóstico e especialidades, com apresentação da história, serviços, direção e canais oficiais de contato."
version = "1.0.0"
id = "artifacts/interclim-site"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 18742

[services.development]
run = "pnpm --filter @workspace/interclim-site run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/interclim-site", "run", "build" ]
serve = "static"
publicDir = "artifacts/interclim-site/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "18742"
BASE_PATH = "/"
